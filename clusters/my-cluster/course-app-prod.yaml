apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: course-app-production
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps/course-app/overlays/production
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      dragonfly_replicas: 2
      app_replicas: 11